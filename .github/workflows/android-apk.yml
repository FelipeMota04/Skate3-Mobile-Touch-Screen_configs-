name: Build Android APK

# Builds an installable APK from this repository's Java/Android code.
#
# The native libraries (libskate3.so etc.) are generated from a retail Skate 3
# dump, which cannot live in CI. Instead they are taken from the official
# release APK and combined with the Java code in this repo (e.g. the touch
# controls editor). Native code changes still require ./build-android.sh on a Mac.

on:
  workflow_dispatch:
    inputs:
      native_apk_url:
        description: "APK to take native libraries from"
        required: false
        default: "https://github.com/Buku313/Skate3-Mobile/releases/latest/download/Skate3-Mobile-Android.apk"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Fetch prebuilt native libraries
        env:
          NATIVE_APK_URL: ${{ inputs.native_apk_url || 'https://github.com/Buku313/Skate3-Mobile/releases/latest/download/Skate3-Mobile-Android.apk' }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/native.apk "$NATIVE_APK_URL"
          mkdir -p android/app/libs/arm64-v8a
          unzip -j -o /tmp/native.apk 'lib/arm64-v8a/*.so' -d android/app/libs/arm64-v8a
          ls -l android/app/libs/arm64-v8a
          for lib in libskate3.so librexruntime.so; do
            test -f "android/app/libs/arm64-v8a/$lib"
          done

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             out/Skate3-Mobile-TouchControls-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Skate3-Mobile-TouchControls-debug
          path: out/Skate3-Mobile-TouchControls-debug.apk
          if-no-files-found: error

